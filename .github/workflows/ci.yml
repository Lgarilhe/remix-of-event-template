name: CI

# Contrôles obligatoires sur chaque PR vers main. Complète le hook pre-commit
# de .claude/settings.json (qui, lui, ne s'applique qu'aux commits passés par
# l'outil Bash de Claude Code — un git commit humain ou un push direct le
# contourne). Ici, c'est GitHub qui fait foi.
#
# Philosophie RATCHET : build bloquant (il passe déjà), type-check et lint ne
# bloquent que si la PR AUGMENTE le nombre d'erreurs — la dette existante
# passe, une régression est refusée.
#
# ⚠️ 2026-07-16 : les baselines FIXES (TSC_BASELINE=32, LINT_BASELINE=1811)
# ont été remplacées par une comparaison PR vs BASE calculée DANS LE MÊME JOB.
# Raison : le compte tsc/eslint varie de ±3 selon l'environnement (version de
# node, résolution des deps) — 32/1819 en local node 22, 34/1821-1822 sur les
# runners GitHub. Un seuil absolu échouait donc aléatoirement, y compris sur
# du code identique à main. En comptant main ET la PR sur le même runner avec
# les mêmes deps, la comparaison est déterministe.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-safety:
    name: Agent safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Agent security regression tests
        run: npm run test:agent
      # Lot C1 : garde-fous statiques des fonctions (plus de Notion hors
      # connexion de l'assistant : API, secrets et colonnes ; filtres
      # d'organisation, portail client, rôle Collaborateur).
      - name: C1 regression tests (fonctions)
        run: node --test tests/c1/c1-fonctions.test.mjs
      # Refonte mission, lot 0b : écrivains de l'étape candidat (notation,
      # événements serveur, gestes des utilisateurs), un bloc par sous-lot.
      - name: Lot 0b regression tests (écrivains)
        run: node --test tests/c1/lot0b-ecrivains.test.mjs
      # Agenda Outlook (lot I3), demande A : table member_calendar_accounts,
      # colonnes d'agenda des séances, effacement, purge et export RGPD.
      - name: Agenda Outlook, base de données et RGPD
        run: node --test tests/c1/agenda-base.test.mjs
      # Refonte mission, lot 0c : lectures (vue mission_candidate_rows,
      # get_mission_stage_counts, libellés « au total », outils de
      # l'assistant, purge RGPD en compte seulement), un bloc par sous-lot.
      - name: Lot 0c regression tests (lectures)
        run: node --test tests/c1/lot0c-lectures.test.mjs
      # Refonte mission, lot 0c-3 et 0c-4 : écrans de mission, /pipeline,
      # fiches et annulation sur la vue mission_candidate_rows.
      - name: Lot 0c-3 et 0c-4 regression tests (écrans)
        run: node --test tests/c1/lot0c-socle-ecrans.test.mjs tests/c1/lot0c3-kanban.test.mjs tests/c1/lot0c3-vues.test.mjs tests/c1/lot0c4-pipeline.test.mjs tests/c1/lot0c4-fiches.test.mjs
      # Refonte mission, lots 1 et 2 : nouvelle page mission derrière
      # l'interrupteur (route, redirections en effet, ancienne page intacte,
      # aucune écriture directe de l'étape, jamais ouverts exclus, textes).
      - name: Lots 1 et 2 regression tests (nouvelle page mission)
        run: node --test tests/c1/lot12-mission-v3.test.mjs
      # Refonte mission, lot 3 : règle de la prochaine action et reports
      # « Plus tard » (modules purs, sans import), puis les gardes statiques
      # de l'écran de la carte « Maintenant ».
      - name: Lot 3 regression tests (carte Maintenant)
        run: node --test tests/c1/lot3-*.test.mjs
      # Refonte des séquences, lot 5e : rédaction par l'IA (draft-sequence :
      # crédits avant l'appel, aucune écriture hors débit, aucun module
      # LinkedIn ; create_sequence jamais automatique, écrit par
      # save_sequence_steps ; text-action contrôlé en contexte séquence ;
      # seule la RPC écrit sequence_steps).
      - name: Lot 5e regression tests (rédaction par l'IA)
        run: node --test tests/c1/lot5e-redaction.test.mjs
      # Refonte des séquences, lot 5e-2 : style et niveau de l'IA qui rédige
      # (chaque rédacteur lit les réglages de l'appelant, refuse un niveau
      # au-dessus du plafond de l'organisation avant le garde des crédits,
      # garde et débit au modèle du niveau, aucun identifiant de modèle hors
      # ai-config, aucun nom de modèle dans les textes, vouvoiement imposé).
      - name: Lot 5e-2 regression tests (style et niveau de l'IA)
        run: node --test tests/c1/lot5e2-style-niveau.test.mjs
      # Photos des candidats : la notation garde la photo LinkedIn enregistrée,
      # le rafraîchissement des adresses est branché (tests sans dépendance).
      - name: Photos des candidats (notation)
        run: node --test tests/ux/photos-candidats.test.mjs

  migrations:
    name: Migrations (versions uniques)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Aucune version de migration dupliquée
        # Deux fichiers avec la même version cassent `supabase db push` et le
        # CI e2e (duplicate key sur schema_migrations_pkey). Cas réel : 20260716130000.
        run: |
          dups=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::Versions de migration dupliquées : $dups"
            exit 1
          fi
          echo "OK : $(ls supabase/migrations/*.sql | wc -l) migrations, versions uniques."

  build:
    name: Build (bloquant)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lot C1 : garde-fous statiques du front (gel de la Marketplace, textes,
      # expiration des liens de portail). Ce test lit les sources avec esbuild.
      - name: C1 regression tests (front)
        run: node --test tests/c1/c1-front.test.mjs
      # Refonte mission, lots 1 et 2 : interrupteur et correspondance des
      # adresses (src/lib/missionBeta.ts), règles de la nouvelle page. Ce test
      # empaquette les modules avec esbuild.
      - name: Lots 1 et 2 tests (interrupteur de la nouvelle page mission)
        run: node --test tests/ux/lot12-mission-beta.test.mjs
      # Refonte mission, lot 3 : comportement de la règle de la prochaine
      # action (chaque rang, états des sources, reports, phrases). Dates
      # locales : fuseau fixé.
      - name: Lot 3 tests (règle de la prochaine action et reports)
        env:
          TZ: Europe/Paris
        run: node --test tests/ux/lot3-maintenant.test.mjs
      # Refonte des séquences, lots 5c-1 et 5c-2 : socle des pages Séquences
      # (interrupteur éteint par défaut, routes et accès gardés, aucun lien
      # vers /sequences hors des accès gardés, statut d'une inscription,
      # Parcours sur le graphe, curseurs), puis la pause groupée. Le socle lit
      # les modules TypeScript avec Node 22 (lecture native du TypeScript) ;
      # le second test les transpile avec esbuild. Lot 5d-2 : gardes de l'éditeur
      # unique (seq-v2-editeur) et parité de la charge envoyée à
      # save_sequence_steps avec l'ancien éditeur (seq-v2-charge-utile, hook
      # d'édition réel empaqueté avec esbuild). Lot 5e : écrans de la rédaction
      # par l'IA (lot5e-redaction-ecrans).
      - name: Lot 5c tests (socle des pages Séquences)
        env:
          TZ: Europe/Paris
        run: node --test tests/ux/seq-v2-socle.test.mjs tests/ux/seq-audit-f2d.test.mjs tests/ux/seq-v2-editeur.test.mjs tests/ux/seq-v2-charge-utile.test.mjs tests/ux/lot5e-redaction-ecrans.test.mjs
      # Refonte des séquences, lot 5e-2 : écrans du style et du niveau de l'IA
      # (parité navigateur et serveur, coût de chaque niveau, corps envoyés,
      # carte du niveau au seul propriétaire). Empaquette les modules avec esbuild.
      - name: Lot 5e-2 tests (style et niveau de l'IA, écrans)
        run: node --test tests/ux/lot5e2-style-niveau.test.mjs
      # Design simplifié, fondations : paliers de texte (rien sous 12 px),
      # visages, icônes qui attendent. Ce test empaquette les composants avec esbuild.
      - name: Fondations du design simplifié
        run: node --test tests/ux/fondations-simplicite.test.mjs
      # Design simplifié, lot A : l'accueil (À faire, Missions en cours), rendu
      # des deux panneaux empaqueté avec esbuild.
      - name: Accueil du design simplifié
        run: node --test tests/ux/accueil-simplicite.test.mjs
      # Design simplifié, lot T : la page Tâches (lignes avec visage ou logo,
      # « En retard » sous le réveil, filtres dans un menu, suggestions sous la liste).
      - name: Tâches du design simplifié
        run: node --test tests/ux/taches-simplicite.test.mjs
      # Brief IA (création de mission) : design simplifié, analyse par l'action
      # brief_analysis (Sonnet 5.5), brouillon conservé à la fermeture.
      - name: Brief IA de la création de mission
        run: node --test tests/ux/creation-mission-brief.test.mjs
      # Brief IA, lecture d'offres depuis une adresse web : fonction fetch-job-source
      # (garde SSRF, lecteurs, flux de décision sur réseau simulé) et écrans de choix,
      # d'analyse et de création en lot.
      - name: Lecture d'offres depuis une adresse web
        run: node --test tests/ux/lecture-offres-serveur.test.mjs tests/ux/import-offres.test.mjs
      # Design simplifié, lot P : copie privée des photos (règles de la copie,
      # réserve d'écran, gardes sur la migration, la tâche et les écrans branchés).
      - name: Copie privée des photos (design simplifié)
        run: node --test tests/c1/photos-copie-privee.test.mjs
      # Agenda Outlook (lot I3), demande A : l'effacement RGPD d'un candidat
      # supprime ses séances de qualification et leurs extraits de connaissance.
      - name: Agenda Outlook, effacement des séances
        run: node --test tests/ux/agenda-rgpd-seances.test.mjs
      # Lot P, P-0b : règles pures des adresses de photo (échéance e=, adresses
      # utilisables). Compilées par esbuild : ce fichier demande npm ci, d'où sa
      # place ici et non dans agent-safety.
      - name: Adresses de photo fraîches (P-0b)
        run: node --test tests/ux/photos-adresses-fraiches.test.mjs
      # Messagerie : onglets par état du fil (à répondre, à relancer, en attente)
      # et ligne « À faire » de la conversation. Règles pures compilées par
      # esbuild, jours ouvrés et changement d'heure en heure locale : fuseau fixé.
      - name: Messagerie, onglets par état du fil
        env:
          TZ: Europe/Paris
        run: node --test tests/ux/messagerie-onglets.test.mjs
      - name: Vite production build
        run: npx vite build

  typecheck:
    name: Type-check (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tsc PR vs base (même environnement)
        # shell sans -e/-o pipefail : on gère les codes de sortie à la main.
        shell: bash --noprofile --norc {0}
        run: |
          count_tsc() {
            npx tsc --noEmit -p tsconfig.app.json > tsc.log 2>&1
            local n
            n=$(grep -c 'error TS' tsc.log)
            [ -z "$n" ] && n=0
            echo "$n"
          }

          ERRS_PR=$(count_tsc)
          echo "TypeScript (PR) : $ERRS_PR erreurs"
          tail -20 tsc.log

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "::notice::Pas de base (workflow_dispatch) — rapport informatif uniquement."
            exit 0
          fi

          # Compter la base sur LE MÊME runner avec LES MÊMES deps → déterministe.
          git -c advice.detachedHead=false checkout "$BASE_SHA"
          npm ci > /dev/null 2>&1
          ERRS_BASE=$(count_tsc)
          echo "TypeScript (base main) : $ERRS_BASE erreurs"

          if [ "$ERRS_PR" -gt "$ERRS_BASE" ]; then
            echo "::error::$ERRS_PR erreurs TypeScript sur la PR > $ERRS_BASE sur main — nouvelles erreurs introduites. Corrigez-les ou régénérez src/integrations/supabase/types.ts."
            exit 1
          fi
          if [ "$ERRS_PR" -lt "$ERRS_BASE" ]; then
            echo "::notice::La PR résorbe de la dette TypeScript ($ERRS_BASE → $ERRS_PR). 👏"
          fi
          exit 0

  design:
    name: Design (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dette design PR vs base (docs/design/)
        # Aucun paquet requis : le script ne lit que src/. Le même script mesure
        # la PR puis la base, copié hors du dépôt avant le checkout de la base
        # (sur la première PR, la base ne l'a pas encore).
        shell: bash --noprofile --norc {0}
        run: |
          cp scripts/design/ratchet.mjs "$RUNNER_TEMP/ratchet.mjs"
          node "$RUNNER_TEMP/ratchet.mjs"

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "::notice::Pas de base (workflow_dispatch) : rapport informatif uniquement."
            exit 0
          fi

          git -c advice.detachedHead=false checkout "$BASE_SHA"
          node "$RUNNER_TEMP/ratchet.mjs" --json > "$RUNNER_TEMP/base.json"
          git -c advice.detachedHead=false checkout -
          node "$RUNNER_TEMP/ratchet.mjs" --compare "$RUNNER_TEMP/base.json"
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::La PR augmente au moins un compteur de dette design. Règles : docs/design/01-direction.md."
          fi
          exit $STATUS

  lint:
    name: Lint (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: eslint PR vs base (même environnement)
        shell: bash --noprofile --norc {0}
        run: |
          count_lint() {
            npm run lint > lint.log 2>&1
            # eslint imprime "✖ N problems (E errors, W warnings)" ; 0 problème => pas de ligne.
            local n
            n=$(grep -oE '[0-9]+ problems' lint.log | head -1 | grep -oE '^[0-9]+')
            [ -z "$n" ] && n=0
            echo "$n"
          }

          PROBLEMS_PR=$(count_lint)
          echo "ESLint (PR) : $PROBLEMS_PR problèmes"
          tail -15 lint.log

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "::notice::Pas de base (workflow_dispatch) — rapport informatif uniquement."
            exit 0
          fi

          git -c advice.detachedHead=false checkout "$BASE_SHA"
          npm ci > /dev/null 2>&1
          PROBLEMS_BASE=$(count_lint)
          echo "ESLint (base main) : $PROBLEMS_BASE problèmes"

          if [ "$PROBLEMS_PR" -gt "$PROBLEMS_BASE" ]; then
            echo "::error::$PROBLEMS_PR problèmes ESLint sur la PR > $PROBLEMS_BASE sur main — nouvelles erreurs introduites."
            exit 1
          fi
          if [ "$PROBLEMS_PR" -lt "$PROBLEMS_BASE" ]; then
            echo "::notice::La PR résorbe de la dette ESLint ($PROBLEMS_BASE → $PROBLEMS_PR). 👏"
          fi
          exit 0
