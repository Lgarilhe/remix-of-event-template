name: Deploy Supabase Migrations

# Auto-deploy SQL migrations on push to main when supabase/migrations/** changes.
# Also exposes a manual trigger (workflow_dispatch) usable from the GitHub mobile
# app or web UI — useful for ad-hoc migration runs without a code change (par
# exemple : push une migration sur une branche feature et la déployer en prod).
#
# Required secrets :
#   SUPABASE_ACCESS_TOKEN   — https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    — password de la DB postgres (Dashboard → Settings → Database)
#   Add at https://github.com/Lgarilhe/remix-of-event-template/settings/secrets/actions
#
# ⚠️ Mécanisme : `supabase db push` n'applique QUE les migrations absentes de la
# table de suivi remote `supabase_migrations.schema_migrations`. Si cette table
# est désynchronisée du schéma réel (migrations appliquées hors-bande / collées
# à la main dans le SQL editor, mais jamais enregistrées), `db push` refuse de
# tourner ("Found local migration files to be inserted before the last migration
# on remote database") et le job échoue sous `set -euo pipefail`. C'est ce qui a
# cassé l'auto-apply pendant des semaines (table de suivi à 6 lignes seulement,
# bloc 20260416000000→20260422140000 de la migration Lovable→Supabase).
#
# 🔧 Réparation (one-time / break-glass) : déclencher ce workflow en
# workflow_dispatch avec repair_tracking=true. Ça marque TOUTES les migrations
# locales comme `applied` dans la table de suivi (UPSERT, table de suivi
# uniquement — AUCUN DDL re-joué, réversible via `migration repair --status
# reverted`). À n'utiliser que si la table de suivi est désynchro du schéma réel.
#
# Aucun rollback automatique du DDL : tester en local d'abord avec
# `supabase db reset --linked` (sur preview branch).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (only show what would be applied, no actual changes)'
        required: false
        type: boolean
        default: false
      repair_tracking:
        description: 'BREAK-GLASS: mark ALL local migrations as applied in the remote tracking table (use only if tracking is desynced from the real schema — touches the tracking table only, no DDL re-run)'
        required: false
        type: boolean
        default: false

env:
  SUPABASE_PROJECT_REF: crckfywoyjxkawathdff

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` 404s when the action's latest-release lookup lags
          # behind a new CLI publish. 2.90.0 is proven against this project.
          version: 2.90.0

      - name: Verify required secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing+=("SUPABASE_DB_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"
            echo "Add them at https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "  - SUPABASE_ACCESS_TOKEN  : https://supabase.com/dashboard/account/tokens"
            echo "  - SUPABASE_DB_PASSWORD   : Dashboard → Settings → Database → Connection string"
            exit 1
          fi

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: List pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "=== Migration status (LOCAL vs REMOTE) ==="
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" || true

      - name: Repair migration tracking (break-glass — tracking table only)
        if: ${{ inputs.repair_tracking == true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Reconcile supabase_migrations.schema_migrations with the real schema:
          # mark every local migration version as 'applied'. This is an UPSERT
          # into the tracking table ONLY — it does NOT execute any migration DDL.
          # Safe because the production schema is kept current out-of-band; this
          # only records that fact. Reversible: `migration repair --status reverted`.
          mapfile -t VERSIONS < <(for f in supabase/migrations/*.sql; do basename "$f" | grep -oE '^[0-9]+'; done | sort -u)
          echo "=== Repairing ${#VERSIONS[@]} migration versions as 'applied' (tracking table only) ==="
          supabase migration repair --status applied "${VERSIONS[@]}" --linked --password "$SUPABASE_DB_PASSWORD"
          echo "=== Tracking table AFTER repair ==="
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" || true

      - name: Apply migrations (db push)
        if: ${{ inputs.dry_run != true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "=== Pushing migrations to production ==="
          # Sans --include-all : ne pousse QUE les migrations absentes de la
          # table de suivi remote. Suppose cette table synchro avec le schéma
          # réel — si désynchro, lancer d'abord en repair_tracking=true.
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run — show pending migrations (no changes)
        if: ${{ inputs.dry_run == true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "=== Dry run — migrations that WOULD be applied (none = tracking healthy) ==="
          supabase db push --dry-run --linked --password "$SUPABASE_DB_PASSWORD"
          echo "::notice::Dry run mode — no migrations were applied. Re-run with dry_run=false to push."

      - name: Final migration status
        if: ${{ inputs.dry_run != true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "=== Final state ==="
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" || true
