name: Deploy Supabase Migrations

# Auto-deploy SQL migrations on push to main when supabase/migrations/** changes.
# Also exposes a manual trigger (workflow_dispatch) usable from the GitHub mobile
# app or web UI — useful for ad-hoc migration runs without a code change (par
# exemple : push une migration sur une branche feature et la déployer en prod).
#
# Required secrets :
#   SUPABASE_ACCESS_TOKEN   — https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    — password de la DB postgres (Dashboard → Settings → Database)
#   Add at https://github.com/Lgarilhe/remix-of-event-template/settings/secrets/actions
#
# ⚠️ Les migrations Supabase sont APPEND-ONLY et idempotentes (CREATE TABLE IF
# NOT EXISTS, etc.). On utilise `supabase db push` qui détecte les nouvelles
# migrations et les applique dans l'ordre. Aucun rollback automatique : tester
# en local d'abord avec `supabase db reset --linked` (sur preview branch).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (only show what would be applied, no actual changes)'
        required: false
        type: boolean
        default: false

env:
  SUPABASE_PROJECT_REF: crckfywoyjxkawathdff

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` 404s when the action's latest-release lookup lags
          # behind a new CLI publish. 2.90.0 is proven against this project.
          version: 2.90.0

      - name: Verify required secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing+=("SUPABASE_DB_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"
            echo "Add them at https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "  - SUPABASE_ACCESS_TOKEN  : https://supabase.com/dashboard/account/tokens"
            echo "  - SUPABASE_DB_PASSWORD   : Dashboard → Settings → Database → Connection string"
            exit 1
          fi

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: List pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "=== Migration status (LOCAL vs REMOTE) ==="
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" || true

      - name: Apply migrations (db push)
        if: ${{ inputs.dry_run != true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "=== Pushing migrations to production ==="
          # Sans --include-all : ne pousse QUE les migrations qui ne sont pas
          # déjà dans la table supabase_migrations remote. --include-all
          # tenterait de re-appliquer les ~100 migrations historiques → plantage.
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run — skipped actual push
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "::notice::Dry run mode — no migrations were applied."
          echo "Re-run this workflow with dry_run=false to actually push."

      - name: Final migration status
        if: ${{ inputs.dry_run != true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "=== Final state ==="
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" || true
