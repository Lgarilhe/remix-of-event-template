name: Candidate actions (API)

# Real local Auth, RLS, RPC and edge handlers; all vendor requests are redirected
# to the scripted fake provider, which speaks the v2 API only (a call of the previous
# API, a wrong key or host, an account id that is not an acc_ id, or an unknown route
# fails the job). No production credentials or browser are used.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'e2e/**'
      - 'tests/c1/candidate-actions-*.test.mjs'
      - 'tests/c1/whatsapp-accounts.test.mjs'
      - 'tests/c1/multichannel-inbox.test.mjs'
      - 'tests/c1/resolve-org-credentials.test.mjs'
      - 'tests/c1/unipile-client.test.mjs'
      - 'tests/c1/assistant-provider-v2.test.mjs'
      - 'tests/ux/unipile-v2-webhooks.test.mjs'
      - 'tests/ux/vendor-mock-v2.test.mjs'
      - 'tests/fixtures/unipile-v2/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/candidate-actions.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'e2e/**'
      - 'tests/c1/candidate-actions-*.test.mjs'
      - 'tests/c1/whatsapp-accounts.test.mjs'
      - 'tests/c1/multichannel-inbox.test.mjs'
      - 'tests/c1/resolve-org-credentials.test.mjs'
      - 'tests/c1/unipile-client.test.mjs'
      - 'tests/c1/assistant-provider-v2.test.mjs'
      - 'tests/ux/unipile-v2-webhooks.test.mjs'
      - 'tests/ux/vendor-mock-v2.test.mjs'
      - 'tests/fixtures/unipile-v2/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/candidate-actions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-actions:
    name: Candidate actions, real local API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_STACK_DIR: /tmp/konekt-candidate-actions-stack
      E2E_BASE_URL: http://127.0.0.1:8080
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/candidate-actions.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Install dependencies
        run: npm ci
      - name: Candidate context, generation, history and personal account tests
        run: node --test tests/c1/candidate-actions-*.test.mjs tests/c1/whatsapp-accounts.test.mjs tests/c1/multichannel-inbox.test.mjs tests/c1/resolve-org-credentials.test.mjs
      - name: Shared provider client, fake provider and webhook guards
        run: node --test tests/c1/unipile-client.test.mjs tests/c1/assistant-provider-v2.test.mjs tests/agent/email-tools-policy.test.mjs tests/ux/unipile-v2-webhooks.test.mjs tests/ux/vendor-mock-v2.test.mjs e2e/local-stack/vendor-mock-contract.test.mjs
      - name: Real channel transport, receipt, incoming history and assistant provider tests
        run: |
          deno test --no-check --allow-env --import-map=e2e/local-stack/import_map.json \
            supabase/functions/_shared/candidate-actions/transport.test.ts \
            supabase/functions/_shared/agent-tools-email.test.ts \
            supabase/functions/_shared/agent-tools-mutations.provider.test.ts
      - name: Check standalone edge contracts
        run: |
          deno check --import-map=e2e/local-stack/import_map.json \
            supabase/functions/_shared/candidate-actions/types.ts \
            supabase/functions/_shared/whatsapp-account.ts
      - name: Start disposable local database, Auth, REST, edge functions and vendors
        run: |
          command -v psql
          docker info > /dev/null
          bash e2e/local-stack/up.sh
      - name: Run candidate action API scenarios without setup dependencies
        run: |
          set -a
          . "$E2E_STACK_DIR/env"
          set +a
          test "$E2E_SUPABASE_URL" = 'http://127.0.0.1:54321'
          test "$E2E_EDGE_FUNCTIONS" = '1'
          test "$E2E_VENDOR_MOCK_URL" = 'http://127.0.0.1:54340'
          # The functions read the provider key and the webhook token from their environment (no per-organization
          # credentials any more): a stack file without them would skip the whole suite.
          test -n "$E2E_UNIPILE_V2_API_KEY"
          test -n "$E2E_UNIPILE_V2_WEBHOOK_TOKEN"
          npx playwright test e2e/api/candidate-actions.spec.ts \
            --project=api --no-deps --workers=1 --retries=0 --reporter=list,json,html
          # A function that swallows a refusal of the fake provider (an old-API call, a wrong host or key,
          # an account id that is not an acc_ id, an unknown route) fails no scenario: check the log.
          node e2e/local-stack/check-violations.mjs
          # A green job must contain executed scenarios, never a skipped suite
          # caused by an absent edge server or missing fake-vendor variables.
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.env.PLAYWRIGHT_JSON_OUTPUT_NAME, 'utf8'));
          const stats = report.stats;
          if (!stats || stats.expected < 1 || stats.skipped !== 0 || stats.unexpected !== 0 || stats.flaky !== 0) {
            throw new Error(`Candidate action scenarios were not all executed successfully: ${JSON.stringify(stats)}`);
          }
          JS
      - name: Upload API report and local diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-actions-api-report
          path: |
            playwright-report/
            test-results/
            /tmp/konekt-candidate-actions-stack/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop disposable local services
        if: always()
        run: bash e2e/local-stack/down.sh --reset
