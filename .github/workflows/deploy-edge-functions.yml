name: Deploy Supabase Edge Functions

# Auto-deploy edge functions on push to main when supabase/functions/** changes.
# Also exposes a manual trigger (workflow_dispatch) usable from the GitHub
# mobile app or web UI — useful for ad-hoc redeploys without a code change.
#
# Required secret: SUPABASE_ACCESS_TOKEN
#   Get one at https://supabase.com/dashboard/account/tokens
#   Add it at https://github.com/Lgarilhe/remix-of-event-template/settings/secrets/actions

on:
  push:
    branches: [main, feat/coresignal-base-konekt-mvp]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Function name (e.g. "score-profile-job"), comma-separated list, or "all". Empty = same logic as auto-deploy.'
        required: false
        default: ''

env:
  SUPABASE_PROJECT_REF: crckfywoyjxkawathdff

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # 77 functions × ~30s = ~40min worst case (full _shared change)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the diff range is github.event.before..sha — on a
          # multi-commit push, `before` is NOT in a shallow depth-2 clone, the
          # diff fails silently (|| true) and NOTHING deploys (bug 2026-06-11).
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` 404s when the action's latest-release lookup lags
          # behind a new CLI publish. 2.90.0 is proven against this project.
          version: 2.90.0

      - name: Verify SUPABASE_ACCESS_TOKEN is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN is not set."
            echo "Generate one at https://supabase.com/dashboard/account/tokens"
            echo "Add it at https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - name: Determine which functions to deploy
        id: funcs
        run: |
          set -euo pipefail

          # [TEMP override — reverted right after this deploy]
          if [ "${{ github.ref_name }}" = "feat/coresignal-base-konekt-mvp" ]; then
            echo "[branch-override] deploying coresignal-search only"
            {
              echo "list<<EOF"
              echo "coresignal-search"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.target }}"
            if [ -z "$INPUT" ] || [ "$INPUT" = "all" ]; then
              echo "[manual] target=all → deploying every function"
              FUNCS=$(ls supabase/functions/ | grep -v '^_' || true)
            else
              echo "[manual] target=$INPUT"
              FUNCS=$(echo "$INPUT" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' || true)
            fi
          else
            # push event — diff against the previous commit
            BEFORE="${{ github.event.before }}"
            # Garde-fou : si le commit `before` est introuvable (force-push,
            # branche neuve, clone incomplet), on redéploie TOUT plutôt que
            # de ne rien déployer silencieusement.
            if ! git cat-file -e "$BEFORE" 2>/dev/null; then
              echo "[auto] before commit unavailable → redeploying ALL edge functions"
              CHANGED="supabase/functions/_shared/forced-full-deploy"
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" || true)
            fi

            if echo "$CHANGED" | grep -q '^supabase/functions/_shared/'; then
              echo "[auto] _shared/ modified → redeploying ALL edge functions"
              FUNCS=$(ls supabase/functions/ | grep -v '^_' || true)
            else
              FUNCS=$(echo "$CHANGED" | grep '^supabase/functions/[^_]' | awk -F/ '{print $3}' | sort -u || true)
              echo "[auto] functions modified in this push:"
              echo "$FUNCS"
            fi
          fi

          if [ -z "$FUNCS" ]; then
            echo "::notice::No functions to deploy"
          fi

          {
            echo "list<<EOF"
            echo "$FUNCS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy functions
        if: steps.funcs.outputs.list != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e  # don't kill the whole loop on a single failure
          FAILED=()
          OK=()
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            # Reject anything that doesn't look like a directory name
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "::warning::Skipping '$fn' — directory not found"
              continue
            fi
            echo "::group::Deploy $fn"
            if supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"; then
              echo "::notice::✓ Deployed $fn"
              OK+=("$fn")
            else
              echo "::error::✗ Failed to deploy $fn"
              FAILED+=("$fn")
            fi
            echo "::endgroup::"
          done <<< "${{ steps.funcs.outputs.list }}"

          echo ""
          echo "=== Summary ==="
          echo "Deployed: ${#OK[@]} (${OK[*]:-none})"
          echo "Failed:   ${#FAILED[@]} (${FAILED[*]:-none})"

          if [ ${#FAILED[@]} -gt 0 ]; then
            exit 1
          fi
